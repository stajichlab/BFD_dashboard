[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bfd-dashboard"
version = "0.1.0"
description = "Static comparative-genomics explorer dashboard for any subset of a BFD duckdb"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "duckdb>=0.10",
    "numpy>=1.21",
    "pandas>=1.3",
    "scipy>=1.7",
    "PyYAML>=5.4",
]

[project.optional-dependencies]
phylogeny = [
    "biopython>=1.79",
]
alt-ordinations = [
    "scikit-learn>=1.0",
    "umap-learn>=0.5",
]
all = [
    "biopython>=1.79",
    "scikit-learn>=1.0",
    "umap-learn>=0.5",
]

[tool.setuptools]
py-modules = []
